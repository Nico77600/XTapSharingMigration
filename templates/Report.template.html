const OPS = { Create: ["Create", "info"], Update: ["Update", "warn"], AddMembers: ["Add members", "info"], Disable: ["Disable", "warn"], NoChange: ["No change", "muted"], Blocked: ["Blocked", "bad"], Conflict: ["Conflict", "bad"] };

const featureText = f => FEATURES[f] || f || "-";
const items = arr(DATA.Items);
const actions = arr(DATA.Actions);
const kind = DATA.Kind || "Collect";

/* ---------- Generic table: search, filters, sort, details ---------- */
function table(container, opts) {
  const cols = opts.columns; let rows = arr(opts.rows);

  const wrap = el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, thead), tbody));

    let view = rows.filter(r => (!state.q || text(r).includes(state.q)) && arr(opts.filters).every(f => !state.filters[f.label] || String(f.value(r) ?? "") === state.filters[f.label]));

/* ---------- Header ---------- */
const t = DATA.Tenant || {};
const titles = { Collect: "Inventory", Plan: "Plan", Apply: "Result" };
const subtitles = {
  Collect: "What Exchange Online shares today with other organizations (Free/Busy, MailTips, calendar sharing), classified for Microsoft 365 X-TAP. Read-only: nothing was changed.",
  Plan: "What the tool would configure in Microsoft 365 X-TAP, compared with the tenant now. Nothing was changed.",

$("#subtitle").textContent = `${t.DisplayName ? t.DisplayName + " \u00b7 " : ""}${t.Organization || ""} \u2014 ${subtitles[kind] || ""}`;
const runRows = [["Generated", fmtDate(DATA.GeneratedAt)], ["Tenant ID", t.TenantId], ["Snapshot", `${DATA.CollectId || "-"} (${fmtDate(DATA.CollectedAt)})`]];

      details: r => [["Policy", r.Policy], ["Tenant ID", r.TenantId], ["Capability", r.Name], ["Allowed", r.IsAllowed ? "Yes" : "No"], ["Included", notes(arr(r.Included).map(s => `${scopeText(s)}${s.ResourceId !== "All" ? " (" + s.ResourceId + ")" : ""}`))], ["Excluded", notes(arr(r.Excluded).map(s => `${scopeText(s)} (${s.ResourceId})`))], ["Modified", fmtDate(r.LastModified)]]
    });
    const trusts = arr(x.Partners).filter(pp => pp.Trust && pp.Trust.State !== "NotConfigured");
    if (trusts.length) {
      card.append(el("h3", { text: "Partner policies with a Microsoft 365 collaboration trust" }));
      card.append(el("div", { class: "chips" }, trusts.map(pp => el("span", { class: "chip" }, `${pp.Name || pp.TenantId} `, statusPill(TRUST, pp.Trust.State)))));
    }
  });
}
if (DATA.Cutover) {
  addPanel("cutover", "Manual cutover", arr(DATA.Cutover.Steps).length, p => {
    const cut = DATA.Cutover;
    p.append(el("div", { class: "callout warn" }, el("strong", { text: "Not run by the tool" }), el("p", { text: "Organization relationships, availability address spaces and sharing policies take precedence over Microsoft 365 X-TAP. When both tenants are ready, disable the old objects in the same window as the partner, test, and keep the rollback commands at hand. Remove the old objects only after validation. The same commands are in ManualCutover.txt." })));
    if (!arr(cut.Steps).length) p.append(el("div", { class: "card" }, el("p", { class: "muted", text: "No Exchange Online object is migrated: nothing to cut over." })));
    for (const s of arr(cut.Steps)) {
      p.append(el("div", { class: "cut" },
        el("h3", {}, pill(s.Source, "accent"), s.Name),
        el("div", { class: "chips" }, arr(s.Features).map(f => el("span", { class: "chip", text: featureText(f) })), arr(s.Partners).map(f => el("span", { class: "chip", text: f }))),
        arr(s.Warnings).length ? el("div", { class: "callout warn", style: "margin-top:10px" }, notes(s.Warnings)) : null,
        el("span", { class: "label", text: "Cutover" }), code(s.Commands),
        el("span", { class: "label", text: "Rollback" }), code(s.Rollback),
        arr(s.Cleanup).length ? [el("span", { class: "label", text: "Cleanup, after validation" }), code(s.Cleanup)] : null));
    }
    if (arr(cut.Partners).length) {
      const card = el("div", { class: "card" }, el("h2", { text: "Partners to coordinate with" }), el("p", { class: "caption" }, "X-TAP is inbound: this tenant now lets each partner read its information. For your users to see the partner's information, the partner configures the same on its side for your tenant ID ", el("code", { text: cut.OwnTenantId }), ", and disables its own organization relationship in the same window."));
      p.append(card);
      table(card, { rows: arr(cut.Partners), search: false, columns: [{ label: "Partner", key: "Name" }, { label: "Tenant ID", key: "TenantId", cls: "mono" }, { label: "Domains", render: r => list(r.Domains) }, { label: "Capabilities in this tenant", render: r => list(r.Capabilities) }, { label: "The partner configures", render: r => arr(r.PartnerConfigures).length ? notes(r.PartnerConfigures) : "its own migration, for your tenant ID", cls: "wrap" }] });
    }
  });
}
if (kind === "Collect") {
  addPanel("next", "Next steps", null, p => {
    const cfg = ".\\config\\XTapSharingMigration.config.psd1";
    const steps = [
      ["Review this inventory", "Check the items in scope and the reasons of the items out of scope. Hybrid relationships are excluded on purpose (Exchange hybrid application).", null, "Any administrator"],
      ["Confirm each partner's tenant ID", "Exchange tenant IDs with each partner: send yours, get theirs confirmed, and paste the Partners entries of PartnersToConfirm.txt in the configuration. An unconfirmed tenant is blocked in the Entra phase (Entra.RequireConfirmedPartners).", null, "Change owner + partner administrators"],
      ["Choose what to migrate (optional)", `Either adjust the rules of ${cfg} (Features: force a level or a scope; Partners: per tenant; Groups: security groups), or complete Selection.csv of this run (Include, Level, Scope) and pass it with -SelectionPath.`, null, "Any administrator"],
      ["Check the plan", "Read-only: compares the target with the tenant and writes Plan.html.", [".\\Invoke-XTapSharingMigration.ps1 -Mode Plan", ".\\Invoke-XTapSharingMigration.ps1 -Mode Plan -SelectionPath .\\Selection.csv"], "Exchange or Entra administrator"],
      ["Phase Entra", "Security groups and the Microsoft 365 collaboration trust of each partner.", [".\\Invoke-XTapSharingMigration.ps1 -Mode Apply -Phase Entra"], "Security Administrator + Groups Administrator (or Global Administrator)"],
      ["Phase Exchange", "Free/Busy, MailTips and calendar sharing capabilities.", [".\\Invoke-XTapSharingMigration.ps1 -Mode Apply -Phase Exchange"], "Exchange Administrator (or Global Administrator)"],
      ["Contact each partner and plan the window", "Send your tenant ID and what you configured, get theirs; agree on the date, the test accounts on both sides, the GO / STOP criteria and who rolls back (guide, chapter 11).", null, "Change owner + partner administrators"],
      ["Cutover, both sides in the same window", "Not done by the tool: run the commands of ManualCutover.txt (disable the organization relationships and the migrated sharing policy entries), the partner does the same.", null, "Exchange Administrator"],
      ["Test, then GO or rollback", "Free/Busy in the Scheduling Assistant, MailTips, calendar sharing, published calendars - and the GetSchedule call in the browser developer tools (guide, chapter 11). Rollback commands are in the same file.", null, "Both sides"],
      ["Clean up after stabilization", "Remove the old objects (cleanup commands), then run Collect again: the new inventory is the closing picture.", null, "Exchange Administrator"]
    ];
    const card = el("div", { class: "card" }, el("h2", { text: "From this inventory to Microsoft 365 X-TAP" }));
    card.append(el("ol", { class: "steps" }, steps.map(([title, text, cmds, who]) => el("li", {}, el("span", { class: "who" }, pill(who, "muted")), el("strong", { text: title }), el("p", { text }), cmds ? code(cmds) : null))));
    p.append(card);
  });
}
if (DATA.Settings && kind !== "Collect") {
  addPanel("settings", "Settings used", null, p => {
    const s = DATA.Settings;
    const card = el("div", { class: "card" }, el("h2", { text: "Configuration rules applied" }));
    p.append(card);
    table(card, { rows: Object.entries(s.Features || {}).map(([k, v]) => ({ Feature: featureText(k), ...v })), search: false, columns: [{ label: "Feature", key: "Feature" }, { label: "Migrate", value: r => r.Migrate ? "Yes" : "No" }, { label: "Level", key: "Level" }, { label: "Scope", key: "Scope" }] });
    card.append(el("h3", { text: "Partners rules" }), arr(s.Partners).length ? code(JSON.stringify(s.Partners, null, 2).split("\n")) : el("p", { class: "muted", text: "None." }));
    card.append(el("h3", { text: "Groups" }), Object.keys(s.Groups || {}).length ? code(JSON.stringify(s.Groups, null, 2).split("\n")) : el("p", { class: "muted", text: "None." }));
    card.append(el("h3", { text: "Other" }), code(JSON.stringify({ SharingPolicyGroups: s.SharingPolicyGroups, Entra: s.Entra, Apply: s.Apply }, null, 2).split("\n")));
  });
}

for (const s of sections) {
  tabs.append(el("button", { type: "button", id: "tab-" + s.id, role: "tab", "aria-selected": "false", onclick: () => activate(s.id) }, s.title, s.count !== null && s.count !== undefined ? el("span", { class: "count", text: s.count }) : null));
  const panel = el("section", { class: "panel", id: "panel-" + s.id, role: "tabpanel" });
  panels.append(panel);

}
tabs.append(el("span", { class: "spacer" }), el("button", { type: "button", class: "tool", text: "Theme", title: "Light / dark", onclick: () => { const n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("xsm-theme", n); } catch (e) { } } }), el("button", { type: "button", class: "tool", text: "Print", onclick: () => window.print() }));
